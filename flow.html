<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>ZeitZurück — Ablauf</title>
<style>
  :root{
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --petrol-deep:#12281d;
    --ivory:#F7F4EB;
    --gold:#C9A054;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--sans);background:var(--petrol-deep);color:var(--ivory);
    display:flex;flex-direction:column;overflow:hidden;cursor:pointer;user-select:none;
  }
  .kopf{padding:20px 24px 6px;flex:0 0 auto}
  .kopf .klein{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:600}
  .kopf h1{font-size:19px;font-weight:600;margin-top:5px;letter-spacing:-.01em}
  .buehne{flex:1 1 auto;min-height:0;position:relative}
  svg{width:100%;height:100%;display:block}

  .fuss{
    flex:0 0 auto;padding:6px 24px 18px;font-size:12.5px;color:rgba(247,244,235,.5);
    display:flex;justify-content:space-between;align-items:center;gap:10px;
  }
  .hinweis{opacity:0;transition:opacity .4s}
  .hinweis.an{opacity:1}

  .ende{
    position:absolute;inset:0;background:rgba(18,40,29,.94);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:30px;gap:9px;
    opacity:0;pointer-events:none;transition:opacity .55s;
  }
  .ende.an{opacity:1}
  .ende .gross{font-size:24px;font-weight:600;letter-spacing:-.015em;line-height:1.32;max-width:560px}
  .ende .klein{font-size:14.5px;color:rgba(247,244,235,.62)}

  .pause{
    position:absolute;top:16px;right:20px;font-size:11px;letter-spacing:.1em;
    text-transform:uppercase;color:rgba(247,244,235,.45);opacity:0;transition:opacity .25s;z-index:3;
  }
  .pause.an{opacity:1}

  /* SVG-Teile */
  .kante{fill:none;stroke:rgba(247,244,235,.16);stroke-width:2}
  .kante-an{fill:none;stroke:var(--gold);stroke-width:2.4;stroke-linecap:round}
  .kasten{fill:rgba(247,244,235,.05);stroke:rgba(247,244,235,.13);stroke-width:1.5;rx:16}
  .knoten.an .kasten{fill:rgba(247,244,235,.11);stroke:rgba(201,160,84,.65)}
  .knoten{opacity:.34;transition:opacity .45s}
  .knoten.an{opacity:1}
  .kasten{transition:fill .45s,stroke .45s}
  .sym{font-size:26px;text-anchor:middle;dominant-baseline:central}
  .name{font-size:13px;font-weight:600;text-anchor:middle;fill:var(--ivory);letter-spacing:-.005em}
  .zusatz{font-size:11.5px;text-anchor:middle;fill:rgba(247,244,235,.5)}
  .badge-bg{fill:rgba(201,160,84,.2);rx:7;opacity:0;transition:opacity .4s}
  .badge-tx{font-size:11px;font-weight:600;text-anchor:middle;fill:var(--gold);opacity:0;transition:opacity .4s}
  .knoten.an .badge-bg,.knoten.an .badge-tx{opacity:1}

  @media (max-width:520px){
    .kopf{padding:16px 18px 4px}
    .kopf h1{font-size:17px}
    .fuss{padding:4px 18px 14px}
  }
</style>
</head>
<body>
<div class="pause" id="pause">Pausiert</div>

<div class="kopf">
  <div class="klein">Der Ablauf</div>
  <h1 id="kopfzeile">Von der Anfrage bis zum Termin</h1>
</div>

<div class="buehne" id="buehne">
  <svg id="leinwand" preserveAspectRatio="xMidYMid meet">
    <defs>
      <pattern id="raster" width="26" height="26" patternUnits="userSpaceOnUse">
        <circle cx="1.4" cy="1.4" r="1.4" fill="rgba(247,244,235,.055)"></circle>
      </pattern>
      <filter id="leuchten" x="-120%" y="-120%" width="340%" height="340%">
        <feGaussianBlur stdDeviation="7" result="b"></feGaussianBlur>
        <feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
      </filter>
    </defs>
    <rect id="hintergrund" fill="url(#raster)"></rect>
    <g id="kanten"></g>
    <g id="knoten"></g>
    <circle id="paket" r="7" fill="#C9A054" filter="url(#leuchten)" opacity="0"></circle>
  </svg>
  <div class="ende" id="ende">
    <div class="gross" id="endeGross"></div>
    <div class="klein" id="endeKlein"></div>
  </div>
</div>

<div class="fuss">
  <span class="hinweis" id="hinweis">Klick zum Pausieren</span>
  <span id="zaehler"></span>
</div>

<script>
(function(){
  var SVGNS = "http://www.w3.org/2000/svg";
  var p = new URLSearchParams(location.search);
  var kurz = (p.get("bis") === "termin");

  /* ---- Knoten mit fester Position auf der Leinwand ---- */
  var KURZ = [
    { x: 90,  y:150, sym:"💬", name:"Anfrage",        zusatz:"Website",        badge:"Kunde schreibt" },
    { x:270,  y:150, sym:"🤖", name:"Nachfragen",     zusatz:"nur das Nötige", badge:"Automatisch" },
    { x:450,  y:150, sym:"⏱️", name:"Dauer schätzen", zusatz:"Erfahrungswerte",badge:"≈ 2 Std" },
    { x:630,  y:150, sym:"📅", name:"Termin suchen",  zusatz:"Ihr Kalender",   badge:"Di, 14:00" },
    { x:810,  y:150, sym:"✅", name:"Buchen",         zusatz:"fix eingetragen",badge:"Gebucht" },
    { x:990,  y:150, sym:"✉️", name:"Bestätigen",     zusatz:"Kunde und Sie",  badge:"Zugestellt" }
  ];
  var LANG = [
    { x: 90,  y:120, sym:"💬", name:"Anfrage",        zusatz:"Website",        badge:"Kunde schreibt" },
    { x:270,  y:120, sym:"🤖", name:"Nachfragen",     zusatz:"nur das Nötige", badge:"Automatisch" },
    { x:450,  y:120, sym:"⏱️", name:"Dauer schätzen", zusatz:"Erfahrungswerte",badge:"≈ 2 Std" },
    { x:630,  y:120, sym:"📅", name:"Termin suchen",  zusatz:"Ihr Kalender",   badge:"Di, 14:00" },
    { x:810,  y:120, sym:"✅", name:"Buchen",         zusatz:"fix eingetragen",badge:"Gebucht" },
    { x:990,  y:120, sym:"✉️", name:"Bestätigen",     zusatz:"Kunde und Sie",  badge:"Zugestellt" },
    { x:270,  y:370, sym:"📋", name:"Auftrag",        zusatz:"in Ihrer App",   badge:"Angelegt" },
    { x:540,  y:370, sym:"⏲️", name:"Zeit erfassen",  zusatz:"vor Ort, ein Tipp", badge:"2 Std 15" },
    { x:810,  y:370, sym:"🧾", name:"Rechnung",       zusatz:"direkt zum Kunden", badge:"Nr. 03/2026" }
  ];

  var K = kurz ? KURZ : LANG;
  var BREITE = 1120;
  var HOEHE  = kurz ? 300 : 500;
  var R = 34;   /* halbe Kastenbreite */

  document.getElementById("kopfzeile").textContent =
    kurz ? "Von der Anfrage bis zum Termin" : "Von der Anfrage bis zur Rechnung";
  document.getElementById("endeGross").textContent =
    kurz ? "Kein Anruf. Kein Rückruf. Kein verpasster Kunde." : "Angefragt, gebucht, erledigt, verrechnet.";
  document.getElementById("endeKlein").textContent =
    kurz ? "Sie erfahren davon, wenn Sie Zeit haben." : "Und Sie waren die ganze Zeit bei der Arbeit.";

  var svg = document.getElementById("leinwand");
  svg.setAttribute("viewBox", "0 0 " + BREITE + " " + HOEHE);
  var bg = document.getElementById("hintergrund");
  bg.setAttribute("width", BREITE); bg.setAttribute("height", HOEHE);

  var gKanten = document.getElementById("kanten");
  var gKnoten = document.getElementById("knoten");
  var paket   = document.getElementById("paket");

  function el(tag, attrs){
    var e = document.createElementNS(SVGNS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  /* ---- Kanten: Bezier von Kasten zu Kasten ---- */
  function kurve(a, b){
    var x1 = a.x + R, y1 = a.y, x2 = b.x - R, y2 = b.y;
    var runter = Math.abs(b.y - a.y) > 40;
    var d;
    if (!runter) {
      var m = (x2 - x1) * .5;
      d = "M " + x1 + " " + y1 + " C " + (x1 + m) + " " + y1 + ", " + (x2 - m) + " " + y2 + ", " + x2 + " " + y2;
    } else {
      /* Sprung in die zweite Reihe: rechts raus, weiter Bogen, links wieder rein */
      x2 = b.x - R;
      d = "M " + x1 + " " + y1 +
          " C " + (x1 + 130) + " " + y1 +
          ", " + (x1 + 150) + " " + ((y1 + y2) / 2) +
          ", " + ((x1 + x2) / 2) + " " + ((y1 + y2) / 2) +
          " S " + (x2 - 150) + " " + y2 +
          ", " + x2 + " " + y2;
    }
    return d;
  }

  var kanten = [];
  for (var i = 0; i < K.length - 1; i++) {
    var d = kurve(K[i], K[i + 1]);
    gKanten.appendChild(el("path", { d: d, "class": "kante" }));
    var hell = el("path", { d: d, "class": "kante-an" });
    gKanten.appendChild(hell);
    var L = hell.getTotalLength();
    hell.style.strokeDasharray = L;
    hell.style.strokeDashoffset = L;
    kanten.push({ el: hell, laenge: L });
  }

  /* ---- Knoten zeichnen ---- */
  var knotenEls = K.map(function(k){
    var g = el("g", { "class": "knoten" });
    g.appendChild(el("rect", { x: k.x - R, y: k.y - R, width: R * 2, height: R * 2, "class": "kasten" }));
    var s = el("text", { x: k.x, y: k.y + 1, "class": "sym" }); s.textContent = k.sym; g.appendChild(s);
    var n = el("text", { x: k.x, y: k.y + R + 22, "class": "name" }); n.textContent = k.name; g.appendChild(n);
    var z = el("text", { x: k.x, y: k.y + R + 39, "class": "zusatz" }); z.textContent = k.zusatz; g.appendChild(z);
    var bw = k.badge.length * 6.6 + 16;
    g.appendChild(el("rect", { x: k.x - bw / 2, y: k.y - R - 26, width: bw, height: 19, "class": "badge-bg" }));
    var bt = el("text", { x: k.x, y: k.y - R - 12, "class": "badge-tx" }); bt.textContent = k.badge; g.appendChild(bt);
    gKnoten.appendChild(g);
    return g;
  });

  /* ---- Ablauf ---- */
  var ende = document.getElementById("ende");
  var pauseEl = document.getElementById("pause");
  var hinweis = document.getElementById("hinweis");
  var zaehler = document.getElementById("zaehler");

  var i = 0, laeuft = true, timer = null, raf = null;
  var REISE = 850, HALT = 620;

  function setzePaket(x, y){
    paket.setAttribute("cx", x); paket.setAttribute("cy", y);
  }

  function aktiviere(n){
    knotenEls[n].classList.add("an");
    zaehler.textContent = (n + 1) + " / " + K.length;
    setzePaket(K[n].x, K[n].y);
    paket.setAttribute("opacity", "1");
  }

  function reise(n, fertig){
    var k = kanten[n];
    var start = performance.now();
    function tick(t){
      if (!laeuft) { raf = requestAnimationFrame(tick); return; }
      var f = Math.min(1, (t - start) / REISE);
      var e = f < .5 ? 2 * f * f : 1 - Math.pow(-2 * f + 2, 2) / 2;
      var pt = k.el.getPointAtLength(e * k.laenge);
      setzePaket(pt.x, pt.y);
      k.el.style.strokeDashoffset = k.laenge * (1 - e);
      if (f < 1) { raf = requestAnimationFrame(tick); } else { fertig(); }
    }
    raf = requestAnimationFrame(tick);
  }

  function schritt(){
    if (i >= K.length) { schluss(); return; }
    aktiviere(i);
    var n = i; i++;
    timer = setTimeout(function(){
      if (!laeuft) { timer = setTimeout(arguments.callee, 200); return; }
      if (n < kanten.length) { reise(n, schritt); } else { schluss(); }
    }, HALT);
  }

  function schluss(){
    paket.setAttribute("opacity", "0");
    ende.classList.add("an");
    timer = setTimeout(function(){ if (laeuft) neustart(); }, 4200);
  }

  function neustart(){
    ende.classList.remove("an");
    knotenEls.forEach(function(e){ e.classList.remove("an"); });
    kanten.forEach(function(k){ k.el.style.strokeDashoffset = k.laenge; });
    paket.setAttribute("opacity", "0");
    i = 0;
    timer = setTimeout(function(){ if (laeuft) schritt(); }, 500);
  }

  document.body.addEventListener("click", function(){
    laeuft = !laeuft;
    pauseEl.classList.toggle("an", !laeuft);
    if (laeuft && !raf) schritt();
  });

  setTimeout(function(){ hinweis.classList.add("an"); }, 1200);
  setTimeout(function(){ hinweis.classList.remove("an"); }, 5600);
  timer = setTimeout(schritt, 500);
})();
</script>
</body>
</html>

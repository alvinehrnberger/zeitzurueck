const docIcon='<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h5"/></svg>';

const el=id=>document.getElementById(id);

function deDate(d){ const x=d?new Date(d):new Date(); return String(x.getDate()).padStart(2,'0')+'.'+String(x.getMonth()+1).padStart(2,'0')+'.'+x.getFullYear(); }
function isoDate(d){ const x=d?new Date(d):new Date(); return x.toISOString().slice(0,10); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function daysBetween(a,b){ return Math.floor((b-a)/86400000); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
/* Adresse -> Karten-App des jeweiligen Geraets (iPhone: Apple Karten, sonst Google Maps) */
function mapsLink(adresse){ return 'https://maps.apple.com/?daddr=' + encodeURIComponent(adresse||''); }

/* ---------- Storno-Hilfen ---------- */
function istStorno(i){ return i.art==='storno'; }
function stornoZu(i){
  if(i.storno_zu) return i.storno_zu;
  const m=(i.positionstext||'').match(/Storno zu Rechnung\s+(\S+\s*\S*)/);
  return m?m[1].trim():null;
}
function istStorniert(i){
  if(i.storniert_am) return true;
  if(!i.nummer) return false;
  return rechnungen.some(r=>istStorno(r) && stornoZu(r)===i.nummer);
}

/* ---------- Zahlungsstatus ---------- */
function faelligAm(i){ return addDays(i.datum||i.created_at||new Date(), konf().zahlungsziel); }
function invStatus(i){
  if(istStorno(i)) return {k:'stornobeleg', txt:'Storno'};
  if(i.art==='bar') return {k:'bar', txt:'Bar'};
  if(istStorniert(i)) return {k:'storniert', txt:'Storniert'};
  if(i.bezahlt_am) return {k:'bezahlt', txt:'Bezahlt'};
  const heute=new Date(), f=faelligAm(i);
  if(heute>f){
    const tage=daysBetween(f,heute);
    if(i.erinnerung_am){
      const m=addDays(i.erinnerung_am,14);
      if(heute>m) return {k:'mahnung', txt:'Mahnung fällig', tage:tage};
      return {k:'erinnert', txt:'Erinnert', tage:tage};
    }
    return {k:'ueberfaellig', txt:'Überfällig', tage:tage};
  }
  return {k:'offen', txt:'Offen'};
}
function invPill(i){
  const s=invStatus(i);
  if(s.k==='stornobeleg') return '<span class="pill storno">Stornobeleg</span>';
  if(s.k==='storniert') return '<span class="pill storno">Storniert</span>';
  if(s.k==='bar') return '<span class="pill cash">Bar</span>';
  if(s.k==='bezahlt') return '<span class="pill done">Bezahlt ✓</span>';
  if(s.k==='mahnung') return '<span class="pill late">Mahnung fällig</span>';
  if(s.k==='ueberfaellig') return '<span class="pill late">'+s.tage+' Tage überfällig</span>';
  if(s.k==='erinnert') return '<span class="pill warn">Erinnert</span>';
  return '<span class="pill open">Offen</span>';
}

/* ---------- Auth ---------- */
function setMode(m){
  mode=m;
  el('lTitle').textContent = m==='signup' ? 'Registrieren' : 'Anmelden';
  el('lBtn').textContent   = m==='signup' ? 'Konto erstellen' : 'Anmelden';
  el('lToggle').innerHTML  = m==='signup'
    ? 'Schon registriert? <a onclick="setMode(\'login\')">Anmelden</a>'
    : 'Noch kein Zugang? <a onclick="setMode(\'signup\')">Registrieren</a>';
  el('pw').setAttribute('autocomplete', m==='signup'?'new-password':'current-password');
  msg('');
}
function msg(t,cls){ const m=el('lMsg'); m.textContent=t||''; m.className='lmsg'+(cls?(' '+cls):''); }
function togglePw(){ const p=el('pw'); p.type = p.type==='password'?'text':'password'; el('eyeBtn').textContent = p.type==='password'?'👁':'🙈'; }
async function submitAuth(){
  const email=el('email').value.trim(), password=el('pw').value;
  if(!email||!password){ msg('Bitte E-Mail und Passwort eingeben.','err'); return; }
  el('lBtn').disabled=true; msg(mode==='signup'?'Konto wird erstellt…':'Anmeldung…');
  try{
    const fn = mode==='signup' ? sb.auth.signUp({email,password}) : sb.auth.signInWithPassword({email,password});
    const { data, error } = await fn;
    if(error) throw error;
    if(!data.session){ msg('Bitte E-Mail bestätigen und erneut anmelden.','ok'); el('lBtn').disabled=false; return; }
    await enterApp();
  }catch(e){ msg(translateErr(((e&&e.message)||'')+' '+((e&&e.name)||'')), 'err'); el('lBtn').disabled=false; }
}
function translateErr(m){
  m=(m||'').trim();
  if(/Invalid login/i.test(m)) return 'E-Mail oder Passwort falsch.';
  if(/already registered|already been registered/i.test(m)) return 'Diese E-Mail ist bereits registriert. Bitte anmelden.';
  if(/at least 6|Password should/i.test(m)) return 'Passwort muss mindestens 6 Zeichen haben.';
  if(/valid email|invalid.*email/i.test(m)) return 'Bitte eine gültige E-Mail eingeben.';
  if(/Retryable|Failed to fetch|NetworkError|\{\}|500|^$/i.test(m)) return 'Verbindungsfehler – bitte in ein paar Sekunden erneut versuchen.';
  return m;
}
async function logout(){ await sb.auth.signOut(); location.reload(); }

/* ---------- Daten ---------- */
async function loadBetriebe(){
  const { data } = await sb.from('betriebe').select('*').order('name');
  betriebe = data || [];
  const saved = localStorage.getItem('zz_betrieb');
  betrieb = betriebe.find(b=>b.id===saved) || betriebe[0] || null;
}
async function loadData(){
  if(!betrieb){ auftraege=[]; rechnungen=[]; return; }
  const [a,r] = await Promise.all([
    sb.from('auftraege').select('*').eq('betrieb_id',betrieb.id).order('termin',{ascending:true}),
    sb.from('rechnungen').select('*').eq('betrieb_id',betrieb.id).order('created_at',{ascending:false})
  ]);
  auftraege = a.data || [];
  rechnungen = r.data || [];
}
function paintBrand(){
  if(betrieb){
    el('barTitle').innerHTML = esc(betrieb.name) + (betriebe.length>1?' <span class="caret">▾</span>':'');
    if(betrieb.logo_url) el('brandMark').innerHTML = '<img src="'+esc(betrieb.logo_url)+'" alt="">';
  } else el('barTitle').textContent='Kein Betrieb verknüpft';
}
async function enterApp(){
  el('login').style.display='none'; el('app').style.display='flex';
  screen.innerHTML='<div class="loading">Lade deinen Betrieb…</div>';
  await loadBetriebe(); await loadData(); paintBrand(); showList();
}
function openBetriebPicker(){
  if(betriebe.length<2) return;
  sheet.innerHTML='<h3>Betrieb wechseln</h3><p class="s">Die Rechnungsnummer läuft fortlaufend über beide Betriebe.</p>'+
    betriebe.map(b=>`<div class="pick ${b.id===betrieb.id?'on':''}" onclick="switchBetrieb('${b.id}')">

  scrim.classList.add('show');
}
async function switchBetrieb(id){
  betrieb = betriebe.find(b=>b.id===id) || betrieb;
  localStorage.setItem('zz_betrieb', betrieb.id);
  scrim.classList.remove('show');

/* ---------- Rechnungsnummer (wird von nummernkreis.js ueberschrieben) ---------- */
function naechsteNummer(){
  const k=konf(), jahr=new Date().getFullYear();
  const bisher = rechnungen.filter(i=>{ if(i.art==='angebot') return false;
        const istDemo = (k.praefix === 'DEMO ');
        const kz = String(i.kreis || String(i.nummer||'').trim().split(' ')[0] || 'M');
        if(((kz === 'DEMO') !== istDemo)) return false;
    if(i.art!=='rechnung' && i.art!=='storno') return false;
    const d=i.datum||i.created_at;
    return d ? (new Date(d)).getFullYear()===jahr : true;
  }).length;
  const offset = (k.startJahr===jahr)? k.startNummer : 0;
  return k.praefix + String(offset+bisher+1).padStart(2,'0') + '/' + jahr;
}

/* ---------- Render ---------- */
function setTab(t){ tab=t; el('tabJobs').classList.toggle('on',t==='jobs'); el('tabInv').classList.toggle('on',t==='inv'); showList(); }
function showList(){
  backBtn.style.display='none'; el('tabs').style.display='flex'; el('fab').style.display='flex';
  el('barSub').textContent='ZeitZurück Rundum'; screen.scrollTop=0;
  tab==='jobs' ? renderJobs() : renderInvoices();
}
function offeneMahnungen(){
  return rechnungen.filter(i=>{ if(i.art==='angebot') return false; const s=invStatus(i); return s.k==='ueberfaellig'||s.k==='mahnung'; });
}
function renderJobs(){
  const open=auftraege.filter(j=>j.status==='offen'||j.status==='angebot'||j.status==='abgelehnt'), done=auftraege.filter(j=>j.status==='erledigt');
  const vorname=(betrieb&&betrieb.inhaber?betrieb.inhaber.split(' ')[0]:'');
  const late=offeneMahnungen();
  screen.innerHTML=`
    <div class="greet">Grüß dich${vorname?', '+esc(vorname):''} 👋</div>
    <div class="gsub">${open.length===1?'1 offener Auftrag':open.length+' offene Aufträge'}${done.length?` · ${done.length} erledigt`:''}</div>
    ${late.length?`<div class="alert"><b>${late.length} unbezahlte Rechnung${late.length>1?'en':''}</b> überfällig. <span style="text-decoration:underline;cursor:pointer" onclick="setTab('inv')">Ansehen ›</span></div>`:''}
    ${open.length?`<div class="lbl">Offen</div>${open.map(jobCard).join('')}`:'<div class="empty">Keine offenen Aufträge.<br>Mit + legst du einen an. 🌿</div>'}
    ${done.length?`<div class="lbl">Erledigt</div>${done.map(jobCard).join('')}`:''}`;
}
function jobPill(j){
  if(j.status==='erledigt') return '<span class="pill done">Erledigt ✓</span>';
  if(j.status==='bar') return '<span class="pill cash">Bar</span>';
  /* Haengt ein Angebot dran, sagt die Pille dasselbe wie die Detailansicht. */
  if(j.status==='angebot'||j.status==='abgelehnt'){
    const a=rechnungen.find(x=>x.art==='angebot'&&x.auftrag_id===j.id);
    if(a){
      if(a.angebot_status==='abgelehnt'||j.status==='abgelehnt') return '<span class="pill storno">Angebot abgelehnt</span>';
      if(a.gesendet_am||(window.zzIstVersendet&&window.zzIstVersendet(a.nummer))) return '<span class="pill today">Angebot versendet</span>';
      return '<span class="pill today">Angebot offen</span>';
    }
  }
  return '<span class="pill today">Offen</span>';
}
function jobCard(j){
  return `<div class="card" onclick="showJob('${j.id}')">
    <div class="ic">${boxIcon}</div>
    <div class="info"><div class="t1">${esc(j.kunde)}</div><div class="t2">${esc(j.aufgabe||'')}</div>
      <div class="meta">${j.termin?`<span>🕒 ${fmtTermin(j.termin)}</span>`:''}${j.adresse?`<span>📍 ${esc(j.adresse)}</span>`:''}</div></div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:7px">${jobPill(j)}<span class="chev">›</span></div>
  </div>`;
}
function fmtTermin(t){
  if(!t) return '';
  const d=new Date(t), now=new Date();
  const hm=d.toLocaleTimeString('de-AT',{hour:'2-digit',minute:'2-digit'});
  if(d.toDateString()===now.toDateString()) return 'Heute · '+hm;
  const wd=['So','Mo','Di','Mi','Do','Fr','Sa'][d.getDay()];
  return wd+' '+String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+' · '+hm;
}
function renderInvoices(){
  /* Angebote sind keine Belege — sie haengen am Auftrag (Angebot ansehen). */
  const belege=rechnungen.filter(i=>i.art!=='angebot');
  const total=belege.filter(i=>i.art!=='bar').reduce((a,b)=>a+Number(b.betrag),0);
  const offen=belege.filter(i=>i.art==='rechnung'&&!i.bezahlt_am&&!istStorniert(i)).reduce((a,b)=>a+Number(b.betrag),0);
  screen.innerHTML=`
    <div class="greet">Rechnungen</div>
    <div class="gsub">${belege.length} Belege · ${eur(total)} verrechnet${offen?` · <b style="color:var(--warn)">${eur(offen)} offen</b>`:''}</div>
    ${belege.length?belege.map(i=>`
      <div class="card ${istStorniert(i)||istStorno(i)?'storniert':''}" onclick="showInvoice('${i.id}')">
        <div class="ic">${docIcon}</div>
        <div class="info"><div class="t1">${esc(i.kunde||'')}</div><div class="t2">${esc(i.positionstext||'')}</div>
          <div class="meta"><span>${i.nummer?('Nr. '+esc(i.nummer)):'Barzahlung'}</span><span>${deDate(i.datum||i.created_at)}</span></div></div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:7px">
          <span style="font-family:'Poppins';font-weight:600;color:${Number(i.betrag)<0?'var(--err)':'var(--petrol)'}">${eur(i.betrag)}</span>
          ${invPill(i)}</div>
      </div>`).join(''):'<div class="empty">Noch keine Rechnungen.<br>Schließe einen Auftrag ab — die Rechnung entsteht automatisch.</div>'}`;
}
function showJob(id){

  backBtn.style.display='block'; el('tabs').style.display='none'; el('fab').style.display='none'; el('barSub').textContent=j.kunde;
  if(j.status!=='offen'){
    const inv=rechnungen.find(i=>i.auftrag_id===id);
    screen.innerHTML=`<div style="padding:4px 2px"><div class="d-h">${esc(j.kunde)}</div><div class="d-s">${esc(j.aufgabe||'')}</div>
      <div class="rows">
        <div class="row"><span class="k">Status</span><span class="v" style="color:var(--ok)">Erledigt</span></div>
        <div class="row"><span class="k">Geleistete Zeit</span><span class="v">${(''+j.stunden).replace('.',',')} Std</span></div>
        ${inv?`<div class="row"><span class="k">${inv.art==='bar'?'Bezahlung':'Rechnung'}</span><span class="v">${inv.art==='bar'?'Bar erhalten':'Nr. '+esc(inv.nummer)}</span></div>
        <div class="row"><span class="k">Betrag</span><span class="v">${eur(inv.betrag)}</span></div>`:''}
      </div>
      <div class="dngr" onclick="deleteJob('${j.id}')">Auftrag löschen</div></div>`;
    return;
  }
  const satz=betrieb?Number(betrieb.stundensatz):50;
  screen.innerHTML=`<div style="padding:4px 2px"><div class="d-h">${esc(j.kunde)}</div><div class="d-s">${esc(j.aufgabe||'')}</div>
    <div class="rows">
      ${j.termin?`<div class="row"><span class="k">Termin</span><span class="v">${fmtTermin(j.termin)}</span></div>`:''}
      ${j.adresse?`<div class="row"><span class="k">Adresse</span><span class="v"><a href="${mapsLink(j.adresse)}" target="_blank" rel="noopener">${esc(j.adresse)} ↗</a></span></div>`:''}
      ${j.kunde_email?`<div class="row"><span class="k">E-Mail</span><span class="v">${esc(j.kunde_email)}</span></div>`:''}
      <div class="row"><span class="k">Stundensatz</span><span class="v">${eur(satz)} / Std</span></div>
      <div class="row"><span class="k">Nächste Rechnung</span><span class="v">${naechsteNummer()}</span></div>
    </div>
    <p style="color:var(--muted);font-size:13px;margin-top:14px">Wenn du fertig bist: „Arbeit abgeschlossen" tippen, echte Stunden eintragen — den Rest erledigt ZeitZurück.</p>
    <div class="dngr" onclick="deleteJob('${j.id}')">Auftrag löschen</div></div>
  <div class="cta"><button class="btn btn-primary" onclick="openComplete('${j.id}')">✓ Arbeit abgeschlossen</button></div>`;
}

async function createJob(){
  const kunde=(el('nKunde').value||'').trim(), aufgabe=(el('nAufgabe').value||'').trim();
  if(!kunde||!aufgabe){ alert('Bitte Kunde und Aufgabe ausfüllen.'); return; }
  const btn=el('nGo'); btn.disabled=true; btn.textContent='Wird angelegt…';
  const rec={ betrieb_id:betrieb.id, kunde:kunde, aufgabe:aufgabe, status:'offen' };
  const mail=(el('nMail').value||'').trim(); if(mail) rec.kunde_email=mail;
  const adr=(el('nAdresse').value||'').trim(); if(adr) rec.adresse=adr;
  const t=el('nTermin').value; if(t) rec.termin=new Date(t).toISOString();
  try{ await sb.from('auftraege').insert(rec); scrim.classList.remove('show'); await loadData(); setTab('jobs'); }
  catch(e){ btn.disabled=false; btn.textContent='Auftrag anlegen'; alert('Fehler: '+e.message); }
}
async function deleteJob(id){
  if(!confirm('Diesen Auftrag wirklich löschen?')) return;
  try{ await sb.from('auftraege').delete().eq('id',id); await loadData(); showList(); }
  catch(e){ alert('Fehler: '+e.message); }
}

/* ---------- PDF: Rechnung / Erinnerung / Mahnung / Storno ---------- */
function buildPDF(i, art){
  art = art || (istStorno(i)?'storno':'rechnung');
  const k=konf(); const { jsPDF }=window.jspdf;
  const doc=new jsPDF({unit:'mm',format:'a4'});
  const L=25,R=185,MID=105;
  const satz=betrieb?Number(betrieb.stundensatz):50, stunden=Number(i.stunden);
  const titel=art==='angebot'?('Angebot Nr. '+i.nummer):art==='storno' ? 'Stornorechnung Nr. '+(i.nummer||'')
              : art==='mahnung' ? 'Mahnung zu Rechnung Nr. '+(i.nummer||'')
              : art==='erinnerung' ? 'Zahlungserinnerung zu Rechnung Nr. '+(i.nummer||'')
              : 'Rechnung Nr. '+(i.nummer||'');

  doc.setFont('helvetica','bold'); doc.setFontSize(15);
  doc.text(betrieb?betrieb.name:'', MID, 22, {align:'center'});
  doc.setFont('helvetica','normal'); doc.setFontSize(11);
  doc.text(betrieb?(betrieb.inhaber||''):'', MID, 28, {align:'center'});
  doc.setFontSize(9); doc.setTextColor(110);
  const kz=[k.strasse,k.plzOrt].filter(Boolean).join(', '); if(kz) doc.text(kz, MID, 33.5, {align:'center'});
  const kt=[k.telefon,k.email].filter(Boolean).join('  ·  '); if(kt) doc.text(kt, MID, 38, {align:'center'});
  doc.setTextColor(0); doc.setDrawColor(26,58,43); doc.setLineWidth(0.6); doc.line(L,43,R,43);

  doc.setFontSize(11); let y=57;
  doc.setFont('helvetica','bold'); doc.text(i.kunde||'', L, y); y+=5.5;
  doc.setFont('helvetica','normal'); doc.setFontSize(10.5);
  (i.kunde_adresse||'').split(/\n|,\s*(?=\d{4}\b)/).filter(Boolean).forEach(z=>{ doc.text(z,L,y); y+=5; });
  /* Absatz nach der Empfaengeradresse, dann rechtsbuendig Ort und Datum. */
  y+=6;
  doc.setFontSize(10.5);
  doc.text((k.ausstellungsort?k.ausstellungsort+', am ':'')+deDate(art==='rechnung'||art==='storno'?(i.datum||new Date()):new Date()), R, y, {align:'right'});

  const yT=Math.max(y+12,82);
  doc.setFont('helvetica','bold'); doc.setFontSize(14); doc.text(titel, R, yT, {align:'right'});
  let yR=yT+12;
  if(art==='storno'){
    doc.setFont('helvetica','normal'); doc.setFontSize(10.5);
    const bez=doc.splitTextToSize('Hiermit stornieren wir die Rechnung Nr. '+(stornoZu(i)||'')+' vollständig. Der ursprünglich in Rechnung gestellte Betrag entfällt.', R-L);
    doc.text(bez,L,yR); yR+=bez.length*5+6;
  }

  doc.setFontSize(8.5); doc.setTextColor(110); doc.setFont('helvetica','bold');
  doc.text('DATUM',L,yR); doc.text('LEISTUNG',L+26,yR); doc.text('€',R,yR,{align:'right'});
  doc.setTextColor(0); doc.setDrawColor(190); doc.setLineWidth(0.25); doc.line(L,yR+2.2,R,yR+2.2);
  yR+=9;
  doc.setFont('helvetica','normal'); doc.setFontSize(10.5);
  doc.text(deDate(i.leistung_datum||i.datum||i.created_at), L, yR);
  const txt=doc.splitTextToSize(i.positionstext||'',92);
  doc.text(txt, L+26, yR);
  doc.text(Number(i.betrag).toLocaleString('de-AT',{minimumFractionDigits:2}), R, yR, {align:'right'});
  let yN=yR+(txt.length*5);
  if(stunden){
    doc.setFontSize(9.5); doc.setTextColor(90);
    doc.text((window.zzPos?window.zzPos(i,stunden,satz):String(stunden).replace('.',',')+' h a € '+satz+',—'), L+26, yN);
    doc.setTextColor(0);
  } else if(art==='angebot'){
    doc.setFontSize(9.5); doc.setTextColor(90);
    doc.text('Pauschale', L+26, yN);
    doc.setTextColor(0);
  }

  const yS=yN+10;
  doc.setDrawColor(26,58,43); doc.setLineWidth(0.6); doc.line(L,yS,R,yS);
  doc.setFont('helvetica','bold'); doc.setFontSize(12.5);
  doc.text(art==='storno'?'Gutschrift':(art==='rechnung'?'Gesamt':'Offener Betrag'), L, yS+7);
  doc.text(Number(i.betrag).toLocaleString('de-AT',{minimumFractionDigits:2})+' €', R, yS+7, {align:'right'});

  let yF=yS+20;
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(80);
  if(art==='erinnerung'||art==='mahnung'){
    const f=deDate(faelligAm(i));
    const et = art==='mahnung'
      ? 'Trotz unserer Zahlungserinnerung konnten wir bis heute keinen Zahlungseingang feststellen. Die Rechnung Nr. '+(i.nummer||'')+' vom '+deDate(i.datum||i.created_at)+' war am '+f+' zur Zahlung fällig. Wir ersuchen Sie höflich, den offenen Betrag binnen 7 Tagen zu überweisen.'
      : 'Die Rechnung Nr. '+(i.nummer||'')+' vom '+deDate(i.datum||i.created_at)+' war am '+f+' zur Zahlung fällig. Vermutlich ist sie in der Alltagshektik untergegangen — wir ersuchen höflich um Überweisung des offenen Betrages. Sollten Sie bereits bezahlt haben, betrachten Sie dieses Schreiben bitte als gegenstandslos.';
    const es=doc.splitTextToSize(et,R-L); doc.text(es,L,yF); yF+=es.length*5+7;
  }
  if(!betrieb || betrieb.kleinunternehmer){
    if(art === 'angebot'){
      doc.setFont('helvetica','bold');
      doc.text('Dieses Angebot ist gültig bis ' + (i.gueltig_bis ? deDate(i.gueltig_bis) : 'auf Widerruf') + '.', L, yF += 7);
      doc.setFont('helvetica','normal');
      /* Pro Satz ein Absatz — und danach rueckt der Zeilenzaehler weiter,
         statt die Umsatzsteuerzeile ueber den letzten Satz zu schreiben. */
      doc.text('Die Annahme erfolgt schriftlich oder über den Link in der begleitenden E-Mail.', L, yF += 7);
      doc.text('Es handelt sich um einen Kostenvoranschlag ohne Gewähr im Sinne des § 5 KSchG.', L, yF += 7);
      yF += 7;
    }
    doc.text('Umsatzsteuerbefreiung gem. § 6 Abs. 1 Z 27 UStG.', L, yF); yF+=9;
  }
  if(art==='rechnung'){ doc.text((window.zzFuss?window.zzFuss(i,satz):'Abgerechnet wird nach tatsächlich geleisteter Zeit zu € '+satz+',— pro Stunde.'), L, yF); yF+=9; }
  if(k.iban && art !== 'storno' && art !== 'angebot'){
    const zt=doc.splitTextToSize('Ich ersuche um Überweisung des oben genannten Betrages '+(art==='rechnung'?('binnen '+k.zahlungsziel+' Tagen '):'')+'auf mein Konto bei der '+k.bank+', mit dem IBAN: '+k.iban+', BIC: '+k.bic+' und verbleibe', R-L);
    doc.text(zt,L,yF); yF+=zt.length*5+7;
          if(art === 'rechnung'){
            doc.setFont('helvetica','bold');
            doc.text('Zahlungsreferenz: ' + zzReferenz(i, art), L, yF += 6);
            doc.setFont('helvetica','normal');
            doc.text('Bitte bei der Überweisung angeben.', L, yF += 4.6);
          }
  }
  doc.text('mit freundlichen Grüßen', L, yF); yF+=12;
  doc.setTextColor(0); doc.setFontSize(10.5);
  /* Unterschrift: ZZ-Belege zeichnen nur als ZeitZurück®. Alle anderen mit
     Name und Betrieb — steckt der Name schon im Betriebsnamen, nur der Betrieb. */
  const kreisU=String(i.nummer||'').trim().split(' ')[0];
  let unterschrift;
  if(kreisU==='ZZ'){ unterschrift='ZeitZurück®'; }
  else{
    const inh=betrieb?(betrieb.inhaber||''):'', bn=betrieb?(betrieb.name||''):'';
    unterschrift=(!inh||bn.toLowerCase().includes(inh.toLowerCase()))?(bn||inh):(inh+' – '+bn);
  }
  doc.text(unterschrift, L, yF);
  return doc;
}
function pdfName(i,art){
  const p = art==='angebot'?'Angebot-':(art==='storno'?'Storno-':(art==='mahnung'?'Mahnung-':(art==='erinnerung'?'Erinnerung-':'Rechnung-')));
  return p+String(i.nummer||'').replace(/[^\w]+/g,'-')+'.pdf';
}
function downloadPDF(id,art){

  buildPDF(i,art).save(pdfName(i,art));
}

/* ---------- Versand ---------- */
    /* ---------- Archiv und Zahlungsreferenz ---------- */
    function zzReferenz(rec, art){
      var n = String((rec && rec.nummer) || '').trim();
      var kern = n.replace(/\s+/g,'').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'');
      return ((art === 'storno') ? 'ST-' : 'RG-') + kern;
    }
    function zzKreisVon(rec){
      /* Das Praefix der Nummer ist die verlaessliche Quelle. Die Spalte kreis kann auf der Vorgabe stehen. */
      var ausNummer = String((rec && rec.nummer) || '').trim().split(' ')[0];
      return String(ausNummer || (rec && rec.kreis) || 'M');
    }
    /* Friert die tatsaechlich verschickte Fassung ein. Schlaegt das fehl, wird NICHT verschickt. */
    async function zzArchivieren(rec, b64, art){
      var kreis = zzKreisVon(rec);
      if(kreis === 'DEMO') return {uebersprungen:'demo'};
      if(art !== 'rechnung' && art !== 'storno') return {uebersprungen:'kein beleg'};
      try{
        var nummer = String(rec.nummer || '').trim();
        if(!nummer) throw new Error('keine Nummer');
        var jahr = new Date(rec.datum || rec.created_at || Date.now()).getFullYear();
        var vor = await sb.from('rechnung_versionen').select('fassung')
                    .eq('betrieb_id', betrieb.id).eq('nummer', nummer);
        if(vor && vor.error) throw new Error(vor.error.message);
        var fassung = 1;
        if(vor && vor.data && vor.data.length){
          fassung = Math.max.apply(null, vor.data.map(function(x){ return Number(x.fassung)||0; })) + 1;
        }
        var sauber = nummer.replace(/\s+/g,'').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'');
        var pfad = betrieb.id + '/' + jahr + '/' + sauber + '_f' + fassung + '.pdf';
        var roh = atob(b64);
        var arr = new Uint8Array(roh.length);
        for(var n2 = 0; n2 < roh.length; n2++) arr[n2] = roh.charCodeAt(n2);
        var hoch = await sb.storage.from('rechnungen')
                     .upload(pfad, new Blob([arr], {type:'application/pdf'}),
                             {contentType:'application/pdf', upsert:false});
        if(hoch && hoch.error) throw new Error('Ablage: ' + hoch.error.message);
        var zeile = await sb.from('rechnung_versionen').insert({
          betrieb_id: betrieb.id, rechnung_id: rec.id || null, nummer: nummer, fassung: fassung,
          empfaenger: rec.kunde || null, empfaenger_email: rec.kunde_email || null,
          betrag: rec.betrag != null ? rec.betrag : null, positionstext: rec.positionstext || null,
          pfad: pfad, anlass: (fassung === 1 ? 'Erstversand' : 'Erneuter Versand')
        });
        if(zeile && zeile.error) throw new Error('Eintrag: ' + zeile.error.message);
        return {pfad: pfad, fassung: fassung};
      }catch(e){
        throw new Error('Nicht verschickt: die Fassung konnte nicht archiviert werden. ' + (e && e.message ? e.message : e));
      }
    }

  } else {

  }

            await zzArchivieren(rec, b64, art);

        text = 'Sehr geehrte/r ' + (rec.kunde || '') + ',\n\n'

      }
      if(art !== 'angebot' && typeof text === 'string' && text.indexOf('Mit freundlichen') > -1){
              text = text.replace('Mit freundlichen', 'Zahlungsreferenz: ' + zzRef + ' (bitte bei der Überweisung angeben)\n\nMit freundlichen');

function pdfVorschau(id){
  const i=rechnungen.find(x=>x.id===id); if(!i) return;
  const art=i.art==='angebot'?'angebot':(istStorno(i)?'storno':'rechnung');
  try{
    const url=buildPDF(i,art).output('bloburl');

    if(!w) downloadPDF(id,art); /* Popup geblockt: dann eben herunterladen */

}

  const i=rechnungen.find(x=>x.id===id);
  const satz=betrieb?Number(betrieb.stundensatz):50;
  sheet.innerHTML=`<h3>${i.art==='angebot'?'Angebot':'Rechnung'} bearbeiten</h3><p class="s">${esc(i.nummer||'')}</p>
    <div class="mailrow"><label>Kunde</label><input id="eKunde" value="${esc(i.kunde||'')}"></div><div class="mailrow"><label>Rechnungsadresse</label><input id="eAdresse" value="${esc(i.kunde_adresse||'')}" placeholder="leer lassen: Adresse vom Auftrag"></div>
    <div class="mailrow"><label>Leistung</label><textarea id="eText">${esc(i.positionstext||'')}</textarea></div>
    <div class="two">
      <div class="mailrow"><label>Stunden</label><input id="eStd" type="number" step="0.5" min="0" value="${i.stunden||''}"></div>
      <div class="mailrow"><label>Betrag (€)</label><input id="eBetrag" type="number" step="0.01" value="${i.betrag}"></div>
    </div>
    <div class="mailrow"><label>Rechnungsdatum</label><input id="eDatum" type="date" value="${isoDate(i.datum||i.created_at)}"></div><div class="mailrow"><label>Datum der Leistung</label><input id="eLeistung" type="date" value="${isoDate(i.leistung_datum||i.datum||i.created_at)}"></div>
    <div class="mailrow"><label>E-Mail des Kunden</label><input id="eMail" type="email" value="${esc(i.kunde_email||'')}"></div>
    <div class="stack">
      <button class="btn btn-primary" id="eGo" onclick="saveEdit('${id}')">Änderungen speichern</button>
      <button class="btn btn-ghost" onclick="openManage('${id}')">Zurück</button>
    </div>
    <div class="note">Stunden ändern rechnet den Betrag automatisch neu (${eur(satz)}/Std) —<br>du kannst den Betrag danach noch überschreiben.</div>`;
  const std=el('eStd'), bet=el('eBetrag');
  std.addEventListener('input',()=>{ const v=parseFloat(std.value); if(!isNaN(v)) bet.value=(v*satz).toFixed(2); });
  scrim.classList.add('show');
}
async function saveEdit(id){
  const btn=el('eGo'); btn.disabled=true; btn.textContent='Wird gespeichert…';
  const upd={
    kunde:(el('eKunde').value||'').trim(),
    positionstext:(el('eText').value||'').trim(),
    betrag:parseFloat(el('eBetrag').value)||0,
    datum:el('eDatum').value||isoDate()
  };
  const st=parseFloat(el('eStd').value); if(!isNaN(st)) upd.stunden=st;
  const ld = (el('eLeistung') ? el('eLeistung').value : '');
      upd.leistung_datum = ld || null;
      const adr = (el('eAdresse') ? el('eAdresse').value.trim() : '');
      upd.kunde_adresse = adr || null;
      const mail=(el('eMail').value||'').trim();
  if(mail) upd.kunde_email=mail;
  try{
    await sb.from('rechnungen').update(upd).eq('id',id);
    scrim.classList.remove('show'); await loadData(); showInvoice(id);
  }catch(e){ btn.disabled=false; btn.textContent='Änderungen speichern'; alert('Fehler: '+e.message); }
}
function openStorno(id){
  const i=rechnungen.find(x=>x.id===id);
  sheet.innerHTML=`<h3>Stornorechnung erstellen</h3>
    <p class="s">Für Rechnung ${esc(i.nummer||'')} · ${esc(i.kunde||'')} · ${eur(i.betrag)}</p>
    <div class="mailrow"><label>Grund (erscheint auf dem Beleg)</label><input id="stGrund" value="Storno zu Rechnung ${esc(i.nummer||'')}" ></div>
    <div class="stack">
      <button class="btn btn-warn" id="stGo" onclick="doStorno('${id}')">⊘ Stornorechnung ${naechsteNummer()} erstellen</button>
      <button class="btn btn-ghost" onclick="openManage('${id}')">Zurück</button>
    </div>
    <div class="note">Es entsteht ein <b>eigener Beleg</b> mit der nächsten Nummer und<br>dem Betrag <b>${eur(-Math.abs(Number(i.betrag)))}</b>. Die Originalrechnung bleibt erhalten —<br>so bleibt deine Buchhaltung lückenlos.</div>`;
  scrim.classList.add('show');
}
async function doStorno(id){
  const i=rechnungen.find(x=>x.id===id);
  const btn=el('stGo'); btn.disabled=true; btn.textContent='Wird erstellt…';
  const grund=(el('stGrund').value||('Storno zu Rechnung '+(i.nummer||''))).trim();
  const payload={ betrieb_id:betrieb.id, auftrag_id:i.auftrag_id||null, nummer:naechsteNummer(),
    kunde:i.kunde, positionstext:grund, stunden:i.stunden, betrag:-Math.abs(Number(i.betrag)), art:'storno', storno_zu:i.nummer };
  try{
    const {data:rec}=await sb.from('rechnungen').insert(payload).select().single();
    try{ await sb.from('rechnungen').update({ storniert_am: isoDate() }).eq('id', id); }catch(e){}
    scrim.classList.remove('show'); await loadData();
    if(rec&&rec.id) showInvoice(rec.id); else showList();
  }catch(e){ btn.disabled=false; btn.textContent='⊘ Stornorechnung erstellen'; alert('Fehler: '+e.message); }
}
function openDelete(id){
  const i=rechnungen.find(x=>x.id===id);
  sheet.innerHTML=`<h3 style="color:var(--err)">Rechnung löschen</h3>
    <p class="s">${esc(i.nummer||'')} · ${esc(i.kunde||'')} · ${eur(i.betrag)}</p>
    <div class="alert" style="background:#fdeceb;border-color:#e8b3ae;color:#9c352c">
      Löschen entfernt den Beleg <b>endgültig</b> und reißt eine Lücke in die Nummernfolge.
      Wenn die Rechnung schon beim Kunden ist, erstelle stattdessen eine <b>Stornorechnung</b>.
    </div>
    <div class="stack">
      <button class="btn btn-err" id="dGo" onclick="doDelete('${id}')">Ja, endgültig löschen</button>
      <button class="btn btn-ghost" onclick="openManage('${id}')">Abbrechen</button>
    </div>`;
  scrim.classList.add('show');
}
async function doDelete(id){
  const btn=el('dGo'); btn.disabled=true; btn.textContent='Wird gelöscht…';
  try{ const weg = await sb.from('rechnungen').delete().eq('id',id).select('id');
      if(weg && weg.error) throw weg.error;
      if(!weg || !weg.data || weg.data.length === 0){
        if(btn){ btn.disabled = false; btn.textContent = 'Endgültig löschen'; }
        alert('Diese Rechnung ist bereits beim Kunden und kann nicht gelöscht werden.\n\nFür eine bereits verschickte Rechnung gibt es den Storno — damit bleibt nachvollziehbar, dass sie aufgehoben wurde. Löschen würde eine Lücke im Nummernkreis hinterlassen.');
        return;
      } scrim.classList.remove('show'); await loadData(); setTab('inv'); }
  catch(e){ btn.disabled=false; btn.textContent='Ja, endgültig löschen'; alert('Fehler: '+e.message); }
}

function openSend(id, art){
  const i=rechnungen.find(x=>x.id===id);
  const j=auftraege.find(x=>x.id===i.auftrag_id);
  const vor=i.kunde_email||(j&&j.kunde_email)||'';
  const bez = art==='angebot'?'Angebot':art==='storno'?'Stornorechnung':(art==='mahnung'?'Mahnung':(art==='erinnerung'?'Zahlungserinnerung':'Rechnung'));
  sheet.innerHTML=`<h3>${bez} senden</h3><p class="s">${esc(i.nummer)} · ${esc(i.kunde||'')} · ${eur(i.betrag)}</p>
    <div class="mailrow"><label>E-Mail des Kunden</label><input id="sendMail" type="email" value="${esc(vor)}" placeholder="kunde@example.com"></div>
    <div class="stack">
      <button class="btn ${art==='mahnung'?'btn-warn':'btn-primary'}" id="sendGo" onclick="doSend('${id}','${art}')">✉ ${bez} mit PDF senden</button>
      <button class="btn btn-ghost" onclick="scrim.classList.remove('show')">Abbrechen</button>
    </div>
    <div class="note">Geht als PDF an den Kunden.<br>Eine Kopie landet in deiner Buchhaltung.</div>`;
  scrim.classList.add('show');
  setTimeout(()=>el('sendMail').focus(),80);
}
async function doSend(id, art){
  const mail=(el('sendMail').value||'').trim();
  if(!/.+@.+\..+/.test(mail)){ alert('Bitte eine gültige E-Mail eingeben.'); return; }
  const btn=el('sendGo'); btn.disabled=true; btn.textContent='Wird gesendet…';
  const i=rechnungen.find(x=>x.id===id);
  const j=auftraege.find(x=>x.id===i.auftrag_id);
  i.kunde_adresse=(j&&j.adresse)||'';
  try{
    await sendDoc(i, mail, art);
    const upd={ kunde_email: mail }, heute=isoDate();
    if(art==='erinnerung') upd.erinnerung_am=heute;
    if(art==='mahnung') upd.mahnung_am=heute;
    try{ await sb.from('rechnungen').update(upd).eq('id',id); }catch(e){}
    scrim.classList.remove('show'); await loadData();
    const bez = art==='angebot'?'Angebot':art==='storno'?'Stornorechnung':(art==='mahnung'?'Mahnung':(art==='erinnerung'?'Erinnerung':'Rechnung'));
    screen.innerHTML=`<div class="done-hero"><div class="big">✓</div><h2>${bez} gesendet</h2>
      <p>${esc(i.nummer)} als PDF an ${esc(mail)} — Kopie liegt in deiner Buchhaltung.</p></div>
      <div class="cta"><button class="btn btn-ghost" onclick="downloadPDF('${i.id}','${art}')">⬇ PDF</button>
      <button class="btn btn-dark" onclick="showList()">Fertig</button></div>`;
    screen.scrollTop=0;
  }catch(e){ btn.disabled=false; btn.textContent='✉ Senden'; alert('Konnte nicht senden: '+e.message); }
}

/* ---------- Abschluss ---------- */
function openComplete(id){
  const j=auftraege.find(x=>x.id===id); curHours=3;
  const satz=betrieb?Number(betrieb.stundensatz):50;
  sheet.innerHTML=`<h3>Arbeit abgeschlossen</h3><p class="s">${esc(j.kunde)} · ${esc(j.aufgabe||'')}</p>
    <p class="s" style="margin-bottom:4px">Wie viele Stunden hast du tatsächlich gearbeitet?</p>
    <div class="hours"><button onclick="stepH(-0.5)">–</button><div class="val" id="hval">3<small> Std</small></div><button onclick="stepH(0.5)">+</button></div>
    <p class="s" style="text-align:center;margin-top:-8px">Ergibt <b id="hsum">${eur(3*satz)}</b> bei ${eur(satz)}/Std</p>
    <div class="mailrow"><label>E-Mail des Kunden (für den Rechnungsversand)</label><input id="cMail" type="email" value="${esc(j.kunde_email||'')}" placeholder="kunde@example.com"></div>
    <div class="stack">
      <button class="btn btn-primary" id="cRech" onclick="finish('${id}','rechnung')">Rechnung erstellen &amp; senden</button>
      <button class="btn btn-ghost" id="cBar" onclick="finish('${id}','bar')">💶 Bar erhalten (Cash)</button>
    </div>
    <div class="note">Rechnungsnummer wird automatisch vergeben: <b>${naechsteNummer()}</b><br>Bar = Auftrag wird nur auf „erledigt" gesetzt, ZeitZurück stellt <b>keinen</b> Beleg aus.</div>`;
  scrim.classList.add('show');
}
function stepH(d){
  curHours=Math.max(0.5,curHours+d);
  const satz=betrieb?Number(betrieb.stundensatz):50;
  el('hval').innerHTML=(''+curHours).replace('.',',')+'<small> Std</small>';
  const s=el('hsum'); if(s) s.textContent=eur(curHours*satz);
}
async function finish(id,art){
  const mailEl=el('cMail'); const mail=(mailEl&&mailEl.value||'').trim();
  if(art==='rechnung' && !/.+@.+\..+/.test(mail)){ alert('Bitte die E-Mail des Kunden eingeben – dorthin geht die Rechnung.'); return; }
  el('cRech').disabled=true; el('cBar').disabled=true;
  if(art==='rechnung') el('cRech').textContent='Rechnung wird erstellt…';
  const j=auftraege.find(x=>x.id===id);
  const satz=betrieb?Number(betrieb.stundensatz):50, sum=curHours*satz;
  try{
    await sb.from('auftraege').update({ status: art==='bar'?'bar':'erledigt', stunden: curHours }).eq('id', id);
    const nummer = art==='rechnung' ? naechsteNummer() : null;
    const payload={ betrieb_id:betrieb.id, auftrag_id:id, nummer, kunde:j.kunde,
      positionstext:j.aufgabe, stunden:curHours, betrag:sum, art };
    if(art==='rechnung') payload.kunde_email=mail;
    let rec=null;
    try{ const {data}=await sb.from('rechnungen').insert(payload).select().single(); rec=data; }
    catch(e){ delete payload.kunde_email; const {data}=await sb.from('rechnungen').insert(payload).select().single(); rec=data; }
    if(!rec) rec=Object.assign({id:'tmp',datum:new Date().toISOString()},payload);
    rec.kunde_adresse=j.adresse||'';
    let versendet=false, sendErr='';
    if(art==='rechnung'){
      try{ await sendDoc(rec, mail, 'rechnung'); versendet=true; }
      catch(e){ sendErr=e.message||'Versand fehlgeschlagen'; }
    }
    scrim.classList.remove('show'); await loadData();
    backBtn.style.display='none'; el('tabs').style.display='none'; el('fab').style.display='none'; el('barSub').textContent=j.kunde;
    screen.innerHTML = art==='bar' ? `
      <div class="done-hero"><div class="big">✓</div><h2>Auftrag erledigt</h2><p>${esc(j.kunde)} · bar bezahlt.</p>
        <div class="checks" style="text-align:left">
          <div><span>✓</span> Auftrag auf „erledigt" gesetzt</div>
          <div style="color:var(--muted)"><span style="color:var(--muted)">–</span> Kein Beleg über ZeitZurück (Barzahlung)</div>
        </div></div>
      <div class="cta"><button class="btn btn-dark" onclick="showList()">Zurück</button></div>`
    : `<div class="done-hero"><div class="big">✓</div><h2>Rechnung ${esc(rec.nummer)} ${versendet?'gesendet':'erstellt'}</h2>
       <p>${versendet?('Als PDF an '+esc(mail)+'. Zahlbar bis '+deDate(faelligAm(rec))+'.'):('Konnte nicht automatisch senden ('+esc(sendErr)+'). Du kannst sie unten erneut senden.')}</p></div>
       <div style="padding:0 2px">${invoiceHTML(rec)}</div>
       <div class="done-hero"><div class="checks" style="text-align:left">
         <div><span>${versendet?'✓':'–'}</span> ${versendet?('Als PDF an '+esc(j.kunde)+' gesendet'):'Noch nicht gesendet'}</div>
         <div><span>✓</span> Kopie in deine Buchhaltung gelegt</div>
         <div><span>✓</span> Auftrag auf „erledigt" gesetzt</div>
       </div></div>
       <div class="cta"><button class="btn btn-ghost" onclick="downloadPDF('${rec.id}')">⬇ PDF</button>
       <button class="btn btn-dark" onclick="showList()">Fertig</button></div>`;
    screen.scrollTop=0;
  }catch(e){ scrim.classList.remove('show'); alert('Fehler beim Speichern: '+e.message); }
}

<script>
(async function(){
  const { data } = await sb.auth.getSession();
  if(data.session) await enterApp();

<script>
/* Bereichsauswahl im Burger-Menue: M, ZZ, V, DEMO. Setzt window.__zzKreis, das konf() liest. */
(function(){
  var KREISE=[["M","Montage"],["ZZ","ZeitZurück"],["V","Veranstaltungstechnik"],["DEMO","Demo"]];
  function geladen(){ try{ return localStorage.getItem("zzKreis")||"M"; }catch(e){ return "M"; } }
  window.__zzKreis = geladen();
  function anzeigen(k){
    document.body.classList.toggle("demolauf", k==="DEMO");
    var b=document.getElementById("demoBand");
    if(b) b.style.display = (k==="DEMO") ? "block" : "none";
    var m=document.getElementById("zzMenu");
    if(m){ [].forEach.call(m.querySelectorAll("button"), function(btn){
      var an = btn.getAttribute("data-k")===k;
      btn.classList.toggle("aktiv", an);
      var h=btn.querySelector(".hak"); if(h) h.textContent = an ? "✓" : "";
    }); }
  }
  function zu(){ var m=document.getElementById("zzMenu"), s=document.getElementById("zzSchirm");
    if(m) m.classList.remove("auf"); if(s) s.classList.remove("auf"); }
  function wechseln(k){
    window.__zzKreis=k;
    try{ localStorage.setItem("zzKreis",k); }catch(e){}
    anzeigen(k); zu(); setTimeout(function(){ platzieren(); }, 60);
    if(typeof loadData==="function"){ try{ loadData(); }catch(e){} }
  }
  function oeffnen(knopf){
    var m=document.getElementById("zzMenu"), s=document.getElementById("zzSchirm");
    var r=knopf.getBoundingClientRect();
    m.style.top=(r.bottom+8)+"px";
    m.style.left=Math.max(10, Math.min(r.left, window.innerWidth-244))+"px";
    m.classList.add("auf"); s.classList.add("auf");
  }
  function bandSetzen(){
    var f = document.getElementById("flag"); if(!f) return;
    var hoch = 0, alle = document.querySelectorAll("button, a, div");
    for(var n = 0; n < alle.length; n++){
      var el = alle[n]; if(el === f) continue;
      var cs = getComputedStyle(el);
      if(cs.position !== "fixed" || cs.display === "none" || cs.visibility === "hidden") continue;
      var r = el.getBoundingClientRect();
      if(r.height < 28 || r.width < 140) continue;
      if(window.innerHeight - r.bottom > 40) continue;
      hoch = Math.max(hoch, window.innerHeight - r.top);
    }
    f.style.bottom = (hoch ? (hoch + 12) : 10) + "px";
  }
  function platzieren(b){
    b = b || document.getElementById("zzBurger");
    var s=document.getElementById("screen"), a=document.getElementById("app");
    if(!b||!s||!a) return;
    /* Detailansichten (Tabs versteckt) brauchen keinen Bereichswechsel —
       dort wuerde der Knopf nur den Beleg ueberdecken. */
    var tabs=document.getElementById("tabs");
    if(tabs && tabs.style.display==="none"){ b.style.display="none"; return; }
    b.style.display="flex";
    var g=document.querySelector(".greet");
    var bez=(g && g.getBoundingClientRect().height>0) ? g : s;
    var rb=bez.getBoundingClientRect(), ra=a.getBoundingClientRect();
    var bar=document.querySelector(".bar");
    var band=document.getElementById("demoBand");
    var unten = bar ? (bar.getBoundingClientRect().bottom-ra.top) : 0;
    if(band && band.style.display!=="none") unten = Math.max(unten, band.getBoundingClientRect().bottom-ra.top);
    var oben = rb.top-ra.top + (bez===s ? 12 : -4);
    b.style.top=Math.max(unten+8, oben)+"px"; b.style.right="15px";
    bandSetzen();
  }
  window.addEventListener("resize", function(){ platzieren(); });
  function beobachten(){
    var s=document.getElementById("screen"); if(!s || window.__zzBeob) return;
    try{ window.__zzBeob=new MutationObserver(function(){ platzieren(); });
      window.__zzBeob.observe(s,{childList:true}); }catch(e){}
  }
  function bauen(){
    var abm=document.querySelector(".out");
    if(!abm || document.getElementById("zzBurger")) return;
    var b=document.createElement("button");
    b.id="zzBurger"; b.className="zzburger"; b.type="button";
    b.setAttribute("aria-label","Bereich wählen");
    b.appendChild(document.createElement("span"));
    b.appendChild(document.createElement("span"));
    b.appendChild(document.createElement("span"));
    (document.getElementById("app")||abm.parentNode).appendChild(b);
    platzieren(b);
    var s=document.createElement("div"); s.id="zzSchirm"; s.className="zzschirm";
    var m=document.createElement("div"); m.id="zzMenu"; m.className="zzmenu";
    var k=document.createElement("div"); k.className="mkopf"; k.textContent="Bereich"; m.appendChild(k);
    KREISE.forEach(function(p){
      var e=document.createElement("button"); e.type="button"; e.setAttribute("data-k",p[0]);
      var t1=document.createElement("span"); t1.textContent=p[1];
      var h=document.createElement("span"); h.className="hak";
      e.appendChild(t1); e.appendChild(h);
      e.addEventListener("click", function(){ wechseln(p[0]); });
      m.appendChild(e);
    });
    document.body.appendChild(s); document.body.appendChild(m);
    b.addEventListener("click", function(ev){ ev.stopPropagation();
      if(m.classList.contains("auf")) zu(); else oeffnen(b); });
    s.addEventListener("click", zu);
    document.addEventListener("keydown", function(ev){ if(ev.key==="Escape") zu(); });
    var band=document.getElementById("demoBand");
    if(!band){ band=document.createElement("div"); band.id="demoBand"; band.className="demoband";
      band.textContent="Demo — diese Rechnungen zählen nicht mit und dürfen gelöscht werden.";
      var tabs=document.getElementById("tabs");
      if(tabs && tabs.parentNode) tabs.parentNode.insertBefore(band, tabs.nextSibling);
    }
    anzeigen(window.__zzKreis); beobachten(); setTimeout(function(){ platzieren(b); },50);
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", bauen); else bauen();
  setTimeout(bauen, 600); setTimeout(bauen, 1800);
})();
</script>

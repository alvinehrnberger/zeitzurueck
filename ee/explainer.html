<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Evolution Ears — Erklärvideo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#0A0A0A; --panel:#101216; --ink:#F4F5F6;
    --muted:rgba(244,245,246,.60); --accent:#7d9ac0; --accent-deep:#0E1A2B;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--black);font-family:"Inter",-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  .stage{position:relative;width:100vw;height:100vh;background:radial-gradient(90% 80% at 78% 26%, rgba(14,26,43,.85), transparent 60%), var(--black);overflow:hidden}
  .scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:8% 9%;text-align:center;opacity:0;visibility:hidden;transition:opacity .55s ease}
  .scene.active{opacity:1;visibility:visible}
  .txt{font-family:"Sora",sans-serif;font-weight:500;color:var(--ink);font-size:clamp(18px,3.2vw,29px);line-height:1.28;max-width:15em;letter-spacing:-.01em}
  .txt b{color:var(--accent);font-weight:600}
  .sub{font-size:clamp(12px,1.9vw,16px);color:var(--muted);font-weight:400}
  .icon{width:clamp(78px,15vw,128px);height:clamp(78px,15vw,128px)}
  .mono{font-family:"Sora",sans-serif;font-weight:700;font-size:clamp(52px,11vw,104px);letter-spacing:-.06em;color:var(--ink)}
  .word{font-size:clamp(11px,2vw,15px);letter-spacing:.42em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-top:2px}
  .tagline{font-size:clamp(11px,1.8vw,14px);letter-spacing:.34em;text-transform:uppercase;color:var(--accent);margin-top:10px}
  @keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
  @keyframes pop{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:none}}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  @keyframes glow{0%,100%{opacity:.5}50%{opacity:1}}
  .scene.active .up{animation:up .7s cubic-bezier(.2,.7,.2,1) both}
  .scene.active .up.d1{animation-delay:.16s}
  .scene.active .up.d2{animation-delay:.32s}
  .scene.active .pop{animation:pop .6s cubic-bezier(.2,.85,.25,1) both}
  .scene.active .float{animation:pop .6s cubic-bezier(.2,.85,.25,1) both, floaty 3s .6s ease-in-out infinite}
  .scene.active .draw{stroke-dasharray:46;stroke-dashoffset:46;animation:draw .6s .5s ease forwards}
  .scene.active .draw-long{stroke-dasharray:150;stroke-dashoffset:150;animation:draw 1.1s .45s ease forwards}
  .scene.active .glow{animation:glow 1.6s .3s ease-in-out infinite}

  /* Steuerung: Klick ins Bild pausiert und startet weiter */
  .stage.playing{cursor:pointer}
  .flash{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.7);
    width:92px;height:92px;border-radius:50%;background:rgba(10,10,10,.7);
    display:flex;align-items:center;justify-content:center;font-size:34px;color:var(--ink);
    opacity:0;pointer-events:none;z-index:7}
  .flash.go{animation:flashOut .65s ease-out forwards}
  @keyframes flashOut{0%{opacity:1;transform:translate(-50%,-50%) scale(.7)}
    100%{opacity:0;transform:translate(-50%,-50%) scale(1.35)}}
  .bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(244,245,246,.1);z-index:6;opacity:0;transition:opacity .3s}
  .stage.playing .bar{opacity:1}
  .bar i{display:block;height:100%;width:0;background:var(--accent)}

  #poster{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:radial-gradient(90% 80% at 78% 26%, rgba(14,26,43,.9), transparent 60%), var(--black);cursor:pointer;z-index:8;padding:8%;transition:opacity .35s ease}
  #poster.hidden{opacity:0;visibility:hidden;pointer-events:none}
  .p-mono{font-family:"Sora";font-weight:700;font-size:clamp(40px,9vw,72px);letter-spacing:-.06em;color:var(--ink)}
  .p-word{font-size:clamp(10px,2vw,13px);letter-spacing:.42em;text-transform:uppercase;color:var(--muted);margin-top:-4px}
  .p-title{color:var(--ink);font-family:"Sora";font-weight:500;font-size:clamp(15px,2.6vw,22px);margin-top:6px}
  .playbtn{width:clamp(60px,12vw,84px);height:clamp(60px,12vw,84px);border-radius:50%;background:var(--ink);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 12px 34px rgba(0,0,0,.5);transition:transform .15s ease;margin-top:8px}
  #poster:hover .playbtn{transform:scale(1.07)}
  .ptri{width:0;height:0;border-style:solid;border-width:12px 0 12px 20px;border-color:transparent transparent transparent #0A0A0A;margin-left:5px}
  .p-cap{color:var(--muted);font-weight:500;font-size:clamp(12px,2vw,16px)}
  @media (prefers-reduced-motion: reduce){ .scene,.scene *{animation:none!important;transition:opacity .3s ease!important} }
</style>
</head>
<body>
<div class="stage" id="stage">
  <section class="scene" data-i="0">
    <svg class="icon pop" viewBox="0 0 120 120" fill="none" stroke="#7d9ac0" stroke-width="6" stroke-linecap="round"><path d="M18 60 h6 M34 46 v28 M50 30 v60 M66 20 v80 M82 38 v44 M98 52 v16"/></svg>
    <div class="txt up d1" data-k="s1"></div>
  </section>
  <section class="scene" data-i="1">
    <svg class="icon pop" viewBox="0 0 120 120" fill="none" stroke="#7d9ac0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M44 42 a22 22 0 0 1 38 16 c0 15 -13 18 -17 27 c-3 7 -3 13 -11 13 a12 12 0 0 1 -12 -12 c0 -8 6 -11 6 -19"/><path d="M52 58 a9 9 0 0 1 17 4"/></svg>
    <div class="txt up d1" data-k="s2"></div>
  </section>
  <section class="scene" data-i="2">
    <svg class="icon float" viewBox="0 0 120 120" fill="none" stroke="#7d9ac0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><rect x="22" y="30" width="76" height="50" rx="12"/><path d="M44 80 l-6 16 20 -16"/><circle cx="48" cy="55" r="3.4" fill="#7d9ac0" stroke="none"/><circle cx="60" cy="55" r="3.4" fill="#7d9ac0" stroke="none"/><circle cx="72" cy="55" r="3.4" fill="#7d9ac0" stroke="none"/></svg>
    <div class="txt up d1" data-k="s3"></div>
  </section>
  <section class="scene" data-i="3">
    <svg class="icon pop" viewBox="0 0 120 120" fill="none"><path d="M60 24 C82 24 96 42 96 66 C96 86 82 98 66 98 C48 98 34 84 34 62 C34 40 44 24 60 24 Z" stroke="#7d9ac0" stroke-width="6" stroke-linejoin="round"/><polyline class="draw" points="49,63 58,73 77,50" fill="none" stroke="#7d9ac0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="txt up d1" data-k="s4"></div>
  </section>
  <section class="scene" data-i="4">
    <svg class="icon pop" viewBox="0 0 120 120" fill="none" stroke="#7d9ac0" stroke-width="6" stroke-linejoin="round"><path d="M46 30 c18 -8 40 4 40 26 c0 16 -10 20 -14 30 c-4 10 -2 20 -16 20 c-16 0 -26 -14 -26 -34 c0 -18 4 -36 16 -42 Z"/><path d="M50 58 a10 10 0 0 1 18 3" stroke-linecap="round"/></svg>
    <div class="txt up d1" data-k="s5"></div>
  </section>
  <section class="scene" data-i="5">
    <svg class="icon pop" viewBox="0 0 120 120" fill="none"><path d="M58 24 L67 52 L95 60 L67 68 L58 96 L49 68 L21 60 L49 52 Z" fill="#7d9ac0" fill-opacity=".16" stroke="#7d9ac0" stroke-width="5" stroke-linejoin="round"/><path class="glow" d="M92 28 l2.5 8 8 2.5 -8 2.5 -2.5 8 -2.5 -8 -8 -2.5 8 -2.5 z" fill="#7d9ac0"/></svg>
    <div class="txt up d1" data-k="s6"></div>
  </section>
  <section class="scene" data-i="6">
    <svg class="icon pop" viewBox="0 0 120 120" fill="none" stroke="#7d9ac0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M26 92 V30 M26 92 H98"/><path class="draw-long" d="M30 78 C46 78 48 48 62 48 C76 48 76 66 96 58" stroke-width="5"/></svg>
    <div class="txt up d1" data-k="s7"></div>
  </section>
  <section class="scene" data-i="7">
    <svg class="icon float" viewBox="0 0 120 120"><path d="M60 24 C82 24 96 42 96 66 C96 86 82 98 66 98 C48 98 34 84 34 62 C34 40 44 24 60 24 Z" fill="#7d9ac0" fill-opacity=".18" stroke="#7d9ac0" stroke-width="6" stroke-linejoin="round"/><text x="62" y="72" text-anchor="middle" font-family="Sora,sans-serif" font-weight="700" font-size="27" letter-spacing="-2" fill="#F4F5F6">ƎE</text></svg>
    <div class="txt up d1" data-k="s8"></div>
  </section>
  <section class="scene" data-i="8">
    <div class="mono pop">ƎE</div>
    <div class="word up d1">Evolution&nbsp;Ears</div>
    <div class="tagline up d2">Hear for you.</div>
  </section>

  <div class="flash" id="flash"></div>
  <div class="bar" id="bar"><i id="barFill"></i></div>

  <div id="poster">
    <div class="p-mono">ƎE</div>
    <div class="p-word">Evolution&nbsp;Ears</div>
    <div class="p-title" data-k="ptitle"></div>
    <button class="playbtn" aria-label="Play"><span class="ptri"></span></button>
    <div class="p-cap" data-k="pcap"></div>
  </div>
</div>
<script>
  var I18N = {
    de: {
      s1:"Ihr Sound, <b>für Sie.</b>",
      s2:"Jedes Ohr ist einzigartig — <b>wie ein Fingerabdruck.</b>",
      s3:"Erzählen Sie uns, <b>wie Sie spielen und hören.</b>",
      s4:"Wir empfehlen das <b>passende Modell.</b>",
      s5:"Der <b>Ohrabdruck</b> wird bei uns in Wien genommen.",
      s6:"Von Hand gefertigt — <b>Schale, Treiber, Finish.</b>",
      s7:"<b>Gemessen</b>, nicht geschätzt.",
      s8:"Ihr IEM. <b>Für niemanden sonst.</b>",
      ptitle:"So funktioniert Evolution Ears",
      pcap:"Klick pausiert jederzeit"
    },
    en: {
      s1:"Your sound, <b>for you.</b>",
      s2:"Every ear is unique — <b>like a fingerprint.</b>",
      s3:"Tell us <b>how you play.</b>",
      s4:"We recommend the <b>right model.</b>",
      s5:"Your <b>ear impression</b> is taken at our Vienna studio.",
      s6:"Built by hand — <b>shell, drivers, finish.</b>",
      s7:"<b>Measured</b>, never guessed.",
      s8:"Your IEM. <b>Made for no one else.</b>",
      ptitle:"How Evolution Ears works",
      pcap:"Click anywhere to pause"
    }
  };
  var lang = (new URLSearchParams(location.search).get("lang") === "en") ? "en" : "de";
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-k]").forEach(function(el){ el.innerHTML = I18N[lang][el.getAttribute("data-k")] || ""; });

  /* Bewusst langsamer als der erste Entwurf — hier steht viel zu lesen. */
  var dur=[4600,4800,4600,4600,4800,4600,4600,4600,5600];
  var scenes=[].slice.call(document.querySelectorAll(".scene"));
  var stage=document.getElementById("stage");
  var poster=document.getElementById("poster");
  var flash=document.getElementById("flash");
  var barFill=document.getElementById("barFill");
  var i=0, timer=null, tick=null, paused=false, startedAt=0, rest=0;

  function activate(idx){
    scenes.forEach(function(s){ s.classList.remove("active"); });
    void scenes[idx].offsetWidth;
    scenes[idx].classList.add("active");
  }
  function lauf(ms){
    clearInterval(tick);
    startedAt = Date.now(); rest = ms;
    tick = setInterval(function(){
      if(paused) return;
      var p = Math.min(1, (Date.now()-startedAt)/dur[i]);
      barFill.style.width = (p*100).toFixed(1) + "%";
    }, 60);
  }
  function weiterSchalten(){
    if(i < scenes.length-1){ i++; step(); } else { finish(); }
  }
  function step(){
    activate(i);
    barFill.style.width = "0%";
    lauf(dur[i]);
    timer = setTimeout(weiterSchalten, dur[i]);
  }
  function play(){
    clearTimeout(timer); clearInterval(tick);
    i=0; paused=false;
    poster.classList.add("hidden");
    stage.classList.add("playing");
    step();
  }
  function finish(){
    clearInterval(tick);
    clearTimeout(timer);
    stage.classList.remove("playing");
    poster.classList.remove("hidden");
  }
  function zeigen(sym){
    flash.textContent = sym;
    flash.classList.remove("go"); void flash.offsetWidth; flash.classList.add("go");
  }
  function pause(){
    paused = true;
    rest = Math.max(400, dur[i] - (Date.now()-startedAt));
    clearTimeout(timer);
    scenes[i].querySelectorAll("*").forEach(function(n){ n.style.animationPlayState="paused"; });
    zeigen("⏸");
  }
  function weiter(){
    paused = false;
    startedAt = Date.now() - (dur[i]-rest);
    scenes[i].querySelectorAll("*").forEach(function(n){ n.style.animationPlayState="running"; });
    timer = setTimeout(weiterSchalten, rest);
    zeigen("▶");
  }

  poster.addEventListener("click", play);
  stage.addEventListener("click", function(e){
    if(!stage.classList.contains("playing")) return;
    if(e.target.closest("#poster")) return;
    paused ? weiter() : pause();
  });
  document.addEventListener("keydown", function(e){
    if(e.code !== "Space") return;
    e.preventDefault();
    if(!stage.classList.contains("playing")){ play(); return; }
    paused ? weiter() : pause();
  });
  window.addEventListener("message", function(e){ if(e && e.data && e.data.type==="ee-play") play(); });
  if(new URLSearchParams(location.search).get("play")) play();
</script>
</body>
</html>
